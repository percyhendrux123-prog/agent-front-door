# One business's front door. Copy this file to run a door for any other business.
business:
  door_id: deployaxiom-front-door
  name: Deploy Axiom
  owner: percy                      # whose yes/no counts; goes on every owner answer receipt
  founder: P. K. Stewart
  email: percy@deployaxiom.com
  booking_url: https://calendar.app.google/rD42RF3YVLaRV52J6
  facts_url: https://deployaxiom.com/facts/
  facts_file: ../data/axiom-facts.snapshot.html   # the human page itself; no second copy of the facts
policies_dir: policies
limits:
  reads_per_minute: 60              # per caller agent
  actions_per_hour: 5               # per caller agent and per person acted for
  owner_questions_per_day: 10       # across all callers; then the door says try tomorrow
  pending_ttl_hours: 72
  decline_days: 90                  # how long a no is remembered
  decline_similarity: 0.6
identity:
  # Web Bot Auth (RFC 9421 HTTP Message Signatures). Who a caller is, by the domain that publishes its key.
  authority: 127.0.0.1:8765          # the host:port callers sign for; production = the door's own host
  # Owner's rule (11-24): any caller may ask for a call; the owner's question says "self reported" or
  # "verified: <domain>". To require a signature for an ask, list it here, e.g. request_call: domain_verified
  min_trust: {}
  max_signature_lifetime_s: 300      # refuse signatures valid for longer than 5 minutes
  key_cache_s: 300                   # re-check a caller's key directory at least every 5 minutes (revocation)
  sign_receipts: true                # the door signs each receipt it returns (key lives in the state dir)
  door_key_url: http://127.0.0.1:8765/.well-known/http-message-signatures-directory
  revoked_keyids: []                 # owner kill switch: refuse these keys even if their domain still lists them
  revoked_agents: []                 # or whole Signature-Agent URLs
