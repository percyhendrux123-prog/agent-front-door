# Two known non-secrets:
# - data/axiom-facts.snapshot.html: the public Cloudflare Web Analytics beacon id served on the live page.
# - the fictional demo partner file: a made-up demo key and its sha256, used only by tests and the demo.
[extend]
useDefault = true

[[allowlists]]
description = "public page snapshot and fictional demo partner"
paths = ['''data/axiom-facts\.snapshot\.html''', '''config/policies/partners/acme-insurance-agent\.yaml''']
