[project]
name = "agent-front-door"
version = "0.1.0"
requires-python = ">=3.11"
description = "An open MCP front door any AI agent can talk to, with the owner's consent rules on every action."
license = "MIT"
dependencies = [
    "cryptography>=43",
    "mcp>=2.3.0",
    "pyyaml>=6.0.4",
]

[dependency-groups]
dev = ["pytest>=9.2.0"]

[project.scripts]
afd-server = "agent_front_door.server:main"
afd = "agent_front_door.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_front_door"]
